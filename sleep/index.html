  /* ---------- 내보내기 / 가져오기 ---------- */
  function blobToDataURL(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(d) {
    var parts = String(d).split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'audio/wav';
    var bin = atob(parts[1] || '');
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function exportData() {
    toast('내보내는 중…');
    Promise.all([dbAll('sessions'), dbAll('clips'), dbGet('settings', 'app')]).then(function (r) {
      var sessions = r[0];
      var clips = r[1];
      var jobs = clips.map(function (c) {
        return blobToDataURL(c.blob).then(function (d) {
          return {
            id: c.id, sessionId: c.sessionId, startAt: c.startAt, durationMs: c.durationMs,
            peakDb: c.peakDb, mime: c.mime, size: c.size, demo: !!c.demo, data: d
          };
        });
      });
      return Promise.all(jobs).then(function (clipsOut) {
        var payload = {
          app: 'sleep-snore-tracker',
          version: 1,
          exportedAt: new Date().toISOString(),
          settings: (r[2] && r[2].value) || settings,
          sessions: sessions,
          clips: clipsOut
        };
        return JSON.stringify(payload);
      });
    }).then(function (json) {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = new Date();
      a.href = url;
      a.download = '수면기록_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      toast('JSON 파일로 내보냈어요');
    }).catch(function (e) {
      toast('내보내기 실패: ' + (e && e.message ? e.message : ''));
    });
  }

  function importData(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var data;
      try { data = JSON.parse(fr.result); } catch (e) { toast('JSON을 읽을 수 없어요'); return; }
      if (!data || data.app !== 'sleep-snore-tracker' || !Array.isArray(data.sessions)) {
        toast('이 앱의 백업 파일이 아니에요');
        return;
      }
      ask('가져오기', '기록 ' + data.sessions.length + '일, 클립 ' + ((data.clips || []).length) + '개를 추가할까요?\n같은 기록은 덮어써요.', [
        { label: '취소', value: false },
        { label: '가져오기', value: true, primary: true }
      ]).then(function (ok) {
        if (!ok) return;
        var chain = Promise.resolve();
        data.sessions.forEach(function (s) {
          chain = chain.then(function () { return dbPut('sessions', s); });
        });
        (data.clips || []).forEach(function (c) {
          chain = chain.then(function () {
            var clip = {
              id: c.id, sessionId: c.sessionId, startAt: c.startAt, durationMs: c.durationMs,
              peakDb: c.peakDb, mime: c.mime || 'audio/wav', size: c.size || 0, demo: !!c.demo,
              blob: dataURLToBlob(c.data)
            };
            return dbPut('clips', clip);
          });
        });
        chain.then(function () {
          toast('가져오기 완료');
          renderHome(); renderSettings();
        }).catch(function (e) {
          toast('가져오기 실패: ' + (e && e.message ? e.message : ''));
        });
      });
    };
    fr.readAsText(file);
  }

  /* ---------- 샘플 불러오기 ---------- */
  function onLoadDemo() {
    ask('샘플 3일 불러오기', '실제 기록과 구분되는 샘플 데이터 3일을 넣습니다.\n그래프·리포트·클립 재생을 지금 바로 확인할 수 있어요.', [
      { label: '취소', value: false },
      { label: '불러오기', value: true, primary: true }
    ]).then(function (ok) {
      if (!ok) return;
      toast('샘플 데이터 만드는 중…');
      loadDemo().then(function (n) {
        toast('샘플 3일을 불러왔어요 (클립 ' + n + '개)');
        renderHome();
        if (state.view === 'settings') renderSettings();
        dbAll('sessions').then(function (list) {
          list.sort(function (a, b) { return b.startedAt - a.startedAt; });
          if (list[0]) openReport(list[0].id);
        });
      }).catch(function (e) {
        toast('샘플 생성 실패: ' + (e && e.message ? e.message : ''));
      });
    });
  }

  /* ---------- 마이크 테스트 ---------- */
  var micTest = { running: false, timer: null, t0: 0, peak: 0, sum: 0, n: 0, snoreMs: 0 };

  function openMicTest() {
    if (Rec.active) { toast('측정 중에는 마이크 테스트를 할 수 없어요'); return; }
    var el = document.getElementById('mic-test');
    if (!el) {
      el = document.createElement('div');
      el.id = 'mic-test';
      el.innerHTML =
        '<div class="mt-card">' +
        '<div class="mt-title">🎙️ 마이크 테스트</div>' +
        '<div class="mt-sub" id="mt-sub">10초 동안 주변 소리를 들어봅니다</div>' +
        '<div class="mt-time" id="mt-time">10</div>' +
        '<div class="meter-track" style="width:100%"><div class="meter-fill" id="mt-fill"></div></div>' +
        '<div class="mt-db" id="mt-db">- dB</div>' +
        '<div class="mt-result" id="mt-result"></div>' +
        '<button class="btn primary" id="mt-close">닫기</button>' +
        '</div>';
      document.body.appendChild(el);
    }
    el.classList.add('on');
    $('#mt-close').onclick = function () {
      micTest.running = false;
      clearInterval(micTest.timer);
      el.classList.remove('on');
      AE.release();
    };
    startMicTest();
  }

  function startMicTest() {
    var sub = $('#mt-sub'), timeEl = $('#mt-time'), fill = $('#mt-fill'), dbEl = $('#mt-db'), res = $('#mt-result');
    res.textContent = '';
    micTest.peak = 0; micTest.sum = 0; micTest.n = 0; micTest.snoreMs = 0;
    AE.ensure().then(function () {
      micTest.running = true;
      micTest.t0 = Date.now();
      clearInterval(micTest.timer);
      var S = sens();
      micTest.timer = setInterval(function () {
        if (!micTest.running) return;
        var a = AE.analyse();
        var left = Math.max(0, 10 - (Date.now() - micTest.t0) / 1000);
        timeEl.textContent = left.toFixed(1);
        if (a) {
          dbEl.textContent = Math.round(a.db) + ' dB · 저역 ' + Math.round(a.lowRatio * 100) + '%';
          fill.style.width = clamp((a.db - 20) / 70 * 100, 2, 100) + '%';
          fill.classList.toggle('snore', a.db >= S.snore && a.lowRatio >= S.ratio);
          micTest.sum += a.db; micTest.n++;
          if (a.db > micTest.peak) micTest.peak = a.db;
          if (a.db >= S.snore && a.lowRatio >= S.ratio) micTest.snoreMs += 100;
        }
        if (left <= 0) {
          clearInterval(micTest.timer);
          micTest.running = false;
          var avg = micTest.n ? micTest.sum / micTest.n : 0;
          var msg = '평균 ' + Math.round(avg) + ' dB · 최고 ' + Math.round(micTest.peak) + ' dB';
          if (micTest.snoreMs > 1500) msg += '\n코골이로 잡힌 구간 ' + (micTest.snoreMs / 1000).toFixed(1) + '초';
          else if (micTest.peak < 45) msg += '\n소리가 작게 잡혀요. 설정에서 마이크 보정을 올려보세요.';
          else msg += '\n마이크가 정상적으로 동작해요.';
          res.textContent = msg;
          AE.release();
        }
      }, 100);
    }).catch(function (err) {
      sub.textContent = '';
      res.textContent = '마이크를 켤 수 없어요.\n' + (err && err.message ? err.message : '') +
        '\nhttps 주소(또는 localhost)에서만 동작합니다.';
      timeEl.textContent = '—';
    });
  }

  /* ---------- 측정 시작/종료 이벤트 ---------- */
  function onStart() {
    var memoEl = $('#memo');
    var memo = memoEl ? memoEl.value.trim() : '';
    if (!isSecure()) {
      ask('https 주소가 필요해요', '이 페이지는 지금 보안 연결이 아니라서 휴대폰이 마이크를 열어주지 않아요.\nhttps:// 로 시작하는 주소로 열어야 측정할 수 있습니다.\n\n(화면과 샘플 데이터는 지금도 확인할 수 있어요.)', [
        { label: '확인', value: true, primary: true }
      ]);
      return;
    }
    var btn = $('#btn-start');
    btn.disabled = true;
    btn.textContent = '마이크 준비 중…';
    AE.ensure().then(function () {
      // 아주 짧게 레벨 확인
      return new Promise(function (res) { setTimeout(res, 400); });
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '🌙 수면 측정 시작';
      settings.savedTags = state.draftTags.slice();
      saveSettings();
      startSession({ tags: state.draftTags, memo: memo });
      toast('측정을 시작했어요. 편히 주무세요 🌙', 3000);
      requestPersist();
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = '🌙 수면 측정 시작';
      ask('마이크를 켤 수 없어요', (err && err.message ? err.message : '권한이 거부되었어요.') +
        '\n\n설정 → 사이트 설정에서 마이크를 허용한 뒤 다시 시도해 주세요.', [
        { label: '확인', value: true, primary: true }
      ]);
    });
  }

  function requestPersist() {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () { });
    }
  }

  function onEndHold(ev) {
    var btn = $('#btn-end');
    var pid = ev && ev.pointerId !== undefined ? ev.pointerId : 1;
    var fill = btn.querySelector('.fill');
    var label = $('#btn-end-label');
    var t0 = Date.now();
    var dur = 1500;
    var raf = null;
    try { if (btn.setPointerCapture) btn.setPointerCapture(pid); } catch (e) { }
    function step() {
      var p = clamp((Date.now() - t0) / dur, 0, 1);
      fill.style.width = (p * 100) + '%';
      if (p >= 1) {
        cancelAnimationFrame(raf);
        fill.style.width = '0%';
        finish();
        return;
      }
      raf = requestAnimationFrame(step);
    }
    function finish() {
      btn.removeEventListener('pointerup', cancel);
      btn.removeEventListener('pointercancel', cancel);
      haptic(30);
      stopSession(true).then(function (s) {
        if (!s) return;
        closeLiveObjects();
        setView('history');
        openReport(s.id);
        if (s.demo === false) toast('측정을 마쳤어요 · ' + fmtHMshort(s.durationMs), 2600);
      });
    }
    function cancel() {
      cancelAnimationFrame(raf);
      fill.style.width = '0%';
      btn.removeEventListener('pointerup', cancel);
      btn.removeEventListener('pointercancel', cancel);
      if (Date.now() - t0 < 400) toast('종료하려면 1.5초 길게 눌러 주세요');
    }
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointercancel', cancel);
    raf = requestAnimationFrame(step);
  }

  function closeLiveObjects() {
    stopPlayer();
    Alarm.stop();
    $('#wake-overlay').classList.remove('on');
    var ev = $('#sleep-events');
    if (ev) ev.textContent = '0회';
    var cl = $('#sleep-clips');
    if (cl) cl.textContent = '0개';
    var sn = $('#sleep-snoretime');
    if (sn) sn.textContent = '0분';
  }

  /* ---------- 이전 세션 복구 ---------- */
  function checkRecovery() {
    dbGet('active', 'active').then(function (rec) {
      if (!rec || !rec.session) return;
      var s = rec.session;
      if (!s.epochs || !s.epochs.length) { dbDel('active', 'active'); return; }
      var gap = Date.now() - (rec.updatedAt || 0);
      if (gap > 36 * 3600000) { dbDel('active', 'active'); return; }
      ask('끝나지 않은 측정이 있어요',
        fmtDateFull(new Date(s.startedAt)) + ' ' + fmtTimeOfDay(new Date(s.startedAt)) + '부터 기록하던 수면이 저장되지 않았어요.\n' +
        '기록 ' + s.epochs.length + '분어치를 살릴까요?', [
        { label: '버리기', value: 'drop' },
        { label: '기록 저장', value: 'save', primary: true }
      ]).then(function (v) {
        if (v === 'save') {
          s.endedAt = s.startedAt + (rec.elapsedMs || s.epochs.length * 60000);
          s.durationMs = s.endedAt - s.startedAt;
          dbByIndex('clips', 'sessionId', s.id).then(function (cl) {
            s.clipCount = cl.length;
            summarize(s);
            return dbPut('sessions', s);
          }).then(function () {
            dbDel('active', 'active');
            toast('기록을 복구했어요');
            renderHome();
          });
        } else {
          dbDel('active', 'active');
        }
      });
    }).catch(function () { });
  }

  /* ---------- 이벤트 연결 ---------- */
  function wireGlobal() {
    document.addEventListener('click', function (ev) {
      var row = ev.target.closest('[data-open]');
      if (row) { openReport(row.getAttribute('data-open')); return; }
      var tab = ev.target.closest('.tabbar button');
      if (tab) { setView(tab.getAttribute('data-view')); return; }
      var tag = ev.target.closest('[data-tag]');
      if (tag) {
        var id = tag.getAttribute('data-tag');
        var i = state.draftTags.indexOf(id);
        if (i >= 0) state.draftTags.splice(i, 1);
        else state.draftTags.push(id);
        renderTags();
        return;
      }
    });
    $('#btn-start').addEventListener('click', onStart);
    $('#btn-mictest').addEventListener('click', openMicTest);
    $('#btn-mictest-top').addEventListener('click', openMicTest);
    $('#btn-demo').addEventListener('click', onLoadDemo);
    $('#btn-tab-settings').addEventListener('click', function () { setView('settings'); });
    $('#home-more').addEventListener('click', function () { setView('history'); });
    $('#btn-alarm-toggle').addEventListener('click', function () { setView('settings'); });
    $('#btn-end').addEventListener('pointerdown', onEndHold);
    $('#btn-dim').addEventListener('click', function () {
      var steps = [0.8, 0.9, 0.96, 0.6];
      var idx = steps.indexOf(settings.dim);
      settings.dim = steps[(idx + 1) % steps.length];
      applyDim();
      saveSettings();
    });
    $('#btn-alarm-off').addEventListener('click', function () {
      Alarm.stop();
      $('#wake-overlay').classList.remove('on');
      toast('알람을 껐어요');
    });
    $('#modal').addEventListener('click', function (ev) {
      if (ev.target.id === 'modal') closeModal();
    });
    window.addEventListener('beforeunload', function (ev) {
      if (Rec.active) {
        ev.preventDefault();
        ev.returnValue = '';
        return '';
      }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { closeModal(); }
    });
  }

  /* ---------- 시작 ---------- */
  function init() {
    loadSettings().then(function () {
      // 매일 밤 처음엔 선택 없이 시작 (지난밤 요인이 그대로 남아 잘못 기록되는 것 방지)
      state.draftTags = [];
      setView('home');
      wireGlobal();
      renderHome();
      checkRecovery();
      window.addEventListener('resize', function () {
        if (state.currentReport && state.view === 'report') {
          var cv = $('#timeline-chart');
          if (cv) drawTimeline(cv, state.currentReport);
        }
      });
    }).catch(function (e) {
      document.body.innerHTML = '<div style="padding:30px;color:#ff8b9c;font-size:14px">앱을 시작하지 못했어요: ' + esc(e && e.message ? e.message : '') + '</div>';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

</script>
</body>
</html>
