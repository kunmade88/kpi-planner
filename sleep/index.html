<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080e">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수면 기록">
<meta name="description" content="개인용 수면·코골이 트래커 — 모든 기록은 이 기기 브라우저 안에만 저장됩니다.">
<title>수면·코골이 트래커</title>
<style>
:root{
  --bg:#07080e;
  --bg-soft:#0b0d15;
  --card:#12151f;
  --card-2:#181c29;
  --card-3:#1f2434;
  --line:#252b3d;
  --line-soft:#1c2130;
  --text:#edf0f8;
  --text-2:#b9c0d2;
  --muted:#828ba3;
  --accent:#8b7bff;
  --accent-soft:#8b7bff22;
  --cyan:#4ad6c8;
  --good:#4ad6a0;
  --warn:#f2b45c;
  --bad:#ff6b81;
  --deep:#3f6bff;
  --light:#4ad6c8;
  --noise:#f2b45c;
  --snore:#ff6b81;
  --radius:20px;
  --tab-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;
  min-height:100dvh;
  overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea{font-family:inherit;font-size:16px;color:var(--text);}
h1,h2,h3,h4,p{margin:0;}
#app{
  max-width:520px;margin:0 auto;position:relative;
  min-height:100dvh;
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px);
}
.view{display:none;padding:0 16px;}
.view.active{display:block;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 상단 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 16px 10px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--bg) 62%, rgba(7,8,14,0));
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.2px;}
.brand .moon{font-size:18px;filter:drop-shadow(0 0 8px #8b7bff66);}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;}
.topbar .actions{display:flex;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;background:var(--card);
  border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:16px;
}
.icon-btn:active{background:var(--card-3);}

/* ---------- 공통 카드 ---------- */
.card{
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.card.tight{padding:14px;}
.card-title{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-title b{color:var(--text-2);font-weight:600;font-size:12px;}
.section-title{font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between;}
.section-title span.more{font-size:12px;color:var(--muted);font-weight:500;}

/* ---------- 홈 히어로 ---------- */
.hero{
  background:radial-gradient(120% 120% at 0% 0%, #1b1b3a 0%, #12151f 55%, #101320 100%);
  border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#8b7bff33,#8b7bff00 70%);}
.hero-label{font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:.2px;}
.hero-row{display:flex;align-items:center;gap:14px;margin-top:10px;}
.score-ring{
  width:74px;height:74px;flex:0 0 74px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:conic-gradient(var(--accent) 0deg, var(--line) 0deg);
}
.score-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#11141f;}
.score-ring span{position:relative;font-size:23px;font-weight:800;letter-spacing:-.5px;}
.score-ring small{position:relative;font-size:10px;color:var(--muted);font-weight:600;margin-left:1px;}
.hero-meta{min-width:0;flex:1;}
.hero-title{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.hero-sub{font-size:13px;color:var(--text-2);margin-top:2px;}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{
  font-size:11px;padding:3px 9px;border-radius:999px;background:#ffffff10;
  color:var(--text-2);border:1px solid #ffffff14;white-space:nowrap;
}
.chip.warn{background:#f2b45c1a;border-color:#f2b45c33;color:#f2b45c;}
.chip.good{background:#4ad6a01a;border-color:#4ad6a033;color:#4ad6a0;}
.chip.demo{background:#8b7bff1f;border-color:#8b7bff3d;color:#b6acff;}

/* ---------- 시작 카드 ---------- */
.tag-grid{display:flex;flex-wrap:wrap;gap:8px;}
.tag{
  padding:8px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-soft);
  font-size:13px;color:var(--text-2);font-weight:500;transition:.15s;
  display:flex;align-items:center;gap:5px;
}
.tag:active{transform:scale(.97);}
.tag.on{background:var(--accent-soft);border-color:#8b7bff66;color:#c9c2ff;}
.tag .em{font-size:14px;}
.memo{
  width:100%;margin-top:10px;background:var(--card-2);border:1px solid var(--line-soft);
  border-radius:14px;padding:11px 12px;resize:none;height:56px;line-height:1.45;
  -webkit-user-select:text;user-select:text;
}
.memo:focus{outline:none;border-color:#8b7bff66;}
.memo::placeholder{color:#5c6479;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 16px;border-radius:16px;font-size:15px;font-weight:700;
  background:var(--card-2);border:1px solid var(--line);color:var(--text);
  transition:.15s;
}
.btn:active{transform:scale(.985);background:var(--card-3);}
.btn.primary{
  background:linear-gradient(135deg,#7a68ff,#5b8bff);border:0;color:#fff;
  box-shadow:0 8px 24px #5b4bff33;
}
.btn.primary:active{box-shadow:0 4px 12px #5b4bff22;}
.btn.ghost{background:#ffffff08;border-color:#ffffff12;color:var(--text-2);font-weight:600;}
.btn.danger{background:#ff6b8114;border-color:#ff6b8133;color:#ff8b9c;}
.btn.small{padding:10px 12px;font-size:13px;border-radius:12px;font-weight:600;}
.btn[disabled]{opacity:.45;}
.btn-row{display:flex;gap:8px;margin-top:10px;}
.btn-row .btn{flex:1;}

.start-wrap{margin:14px 0 4px;}
.start-sub{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;}

/* ---------- 요약 통계 ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat{
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:14px;padding:11px 12px;
}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;}
.stat .v{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-top:2px;}
.stat .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;}

/* ---------- 목록 ---------- */
.row-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--line-soft);margin-bottom:8px;
}
.row-item:active{background:var(--card-2);}
.row-date{width:44px;flex:0 0 44px;text-align:center;}
.row-date .d{font-size:17px;font-weight:800;letter-spacing:-.5px;}
.row-date .m{font-size:10px;color:var(--muted);font-weight:600;}
.row-main{flex:1;min-width:0;}
.row-main .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
.row-main .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.row-score{text-align:right;}
.row-score .n{font-size:17px;font-weight:800;}
.row-score .n.good{color:var(--good);}
.row-score .n.mid{color:var(--warn);}
.row-score .n.bad{color:var(--bad);}
.row-score .l{font-size:10px;color:var(--muted);font-weight:600;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;line-height:1.6;}

/* ---------- 수면 모드 ---------- */
#view-sleep{padding:0;}
.sleep-stage{
  position:fixed;inset:0;z-index:50;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform 1.6s ease;
}
.sleep-stage.hidden{display:none;}
.dim-overlay{position:fixed;inset:0;background:#000;z-index:54;pointer-events:none;}
.sleep-content{position:relative;z-index:52;width:100%;max-width:520px;padding:0 24px;text-align:center;transition:transform 1.8s ease,opacity 1.8s ease;}
.sleep-clock{
  font-size:76px;font-weight:200;letter-spacing:-3px;line-height:1;
  font-variant-numeric:tabular-nums;color:#f4f6ff;
  text-shadow:0 0 30px #6b7bff33;
}
.sleep-date{font-size:12px;color:#5c6479;margin-top:8px;letter-spacing:.4px;}
.sleep-elapsed{margin-top:6px;font-size:14px;color:#8b93a8;font-weight:600;font-variant-numeric:tabular-nums;}
.sleep-tags{font-size:11px;color:#3d4660;margin-top:6px;letter-spacing:.2px;min-height:14px;}
.sleep-meter{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.meter-track{
  width:76%;height:8px;border-radius:99px;background:#111318;overflow:hidden;position:relative;
}
.meter-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#2f6bff,#4ad6c8);transition:width .12s linear;}
.meter-fill.snore{background:linear-gradient(90deg,#ff6b81,#ff9d6b);}
.sleep-db{font-size:13px;color:#6f778c;font-variant-numeric:tabular-nums;}
.sleep-db b{color:#aeb6c9;font-size:15px;}
.sleep-status{
  margin-top:6px;font-size:12px;font-weight:700;letter-spacing:1.5px;color:#4a5468;
  text-transform:uppercase;transition:color .2s;height:18px;
}
.sleep-status.snore{color:#ff8597;}
.sleep-status.noise{color:#f2b45c;}
.sleep-status.calm{color:#3f9d80;}
.sleep-stats{display:flex;justify-content:center;gap:26px;margin-top:30px;}
.sleep-stats div{font-size:11px;color:#4d5568;font-weight:600;}
.sleep-stats b{display:block;font-size:16px;color:#aab2c6;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
.sleep-controls{
  position:fixed;left:0;right:0;bottom:calc(18px + var(--safe-b));z-index:53;
  display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;
}
.sleep-mini{
  padding:9px 14px;border-radius:999px;background:#0c0e14;border:1px solid #1a1e29;
  color:#5d6579;font-size:12px;font-weight:600;
}
.sleep-mini:active{background:#141822;}
.hold-btn{
  padding:13px 22px;border-radius:999px;background:#0c0e14;border:1px solid #232838;
  color:#7d869c;font-size:13px;font-weight:700;position:relative;overflow:hidden;
  min-width:132px;
}
.hold-btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#8b7bff33;transition:width .1s linear;}
.hold-btn span{position:relative;}
.sleep-topbar{
  position:fixed;top:calc(10px + var(--safe-t));left:0;right:0;z-index:53;opacity:.8;
  display:flex;justify-content:space-between;padding:0 20px;font-size:11px;color:#394052;font-weight:600;letter-spacing:.6px;
}
.night-note{
  position:fixed;bottom:calc(78px + var(--safe-b));left:0;right:0;text-align:center;
  font-size:11px;color:#333a4a;z-index:53;padding:0 30px;line-height:1.5;
}

/* ---------- 알람 ---------- */
#wake-overlay{
  position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#241a3d,#08070d 70%);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
}
#wake-overlay.on{display:flex;animation:fadeIn .3s;}
.wake-icon{font-size:52px;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.wake-time{font-size:52px;font-weight:200;letter-spacing:-2px;font-variant-numeric:tabular-nums;}
.wake-msg{font-size:14px;color:var(--text-2);}
#btn-alarm-off{max-width:280px;}

/* ---------- 리포트 ---------- */
.report-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px;}
.back-btn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-2);}
.report-date{font-size:16px;font-weight:700;}
.report-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.score-banner{
  display:flex;align-items:center;gap:16px;padding:18px;
  border-radius:22px;border:1px solid var(--line);
  background:radial-gradient(120% 140% at 100% 0%, #1e2140, #12151f 70%);
  margin-bottom:12px;
}
.score-big{position:relative;width:84px;height:84px;flex:0 0 84px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) 0deg,var(--line) 0deg);}
.score-big::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#141826;}
.score-big .num{position:relative;font-size:28px;font-weight:800;letter-spacing:-1px;}
.score-big .num small{font-size:10px;color:var(--muted);font-weight:600;margin-left:2px;}
.score-info .grade{font-size:15px;font-weight:700;}
.score-info .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
canvas.chart{width:100%;display:block;border-radius:12px;background:#0c0f18;}

.clip-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  background:var(--card-2);border:1px solid var(--line-soft);margin-bottom:8px;
}
.clip-play{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#8b7bff22;border:1px solid #8b7bff44;
  color:#c3bbff;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.clip-play:active{background:#8b7bff3a;}
.clip-main{flex:1;min-width:0;}
.clip-time{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.clip-meta{font-size:11px;color:var(--muted);margin-top:1px;}
.clip-bar{height:3px;background:#ffffff12;border-radius:99px;margin-top:6px;overflow:hidden;}
.clip-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;}
.clip-del{width:32px;height:32px;border-radius:10px;background:#ffffff08;color:#6f778c;font-size:14px;display:flex;align-items:center;justify-content:center;}

/* ---------- 인사이트 ---------- */
.insight-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.insight-label{width:66px;flex:0 0 66px;font-size:12px;font-weight:600;color:var(--text-2);}
.insight-bar{flex:1;height:22px;background:var(--card-2);border-radius:7px;position:relative;overflow:hidden;}
.insight-bar i{position:absolute;left:0;border-radius:5px;background:linear-gradient(90deg,#8b7bff,#5b8bff);}
.insight-bar i.base{background:#394056;}
.insight-val{width:56px;flex:0 0 56px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.insight-val small{display:block;font-size:10px;color:var(--muted);font-weight:500;}

/* ---------- 설정 ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.set-row:last-child{border-bottom:0;}
.set-row .lbl{font-size:14px;font-weight:600;}
.set-row .hint{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;}
.set-row .val{font-size:13px;color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums;}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line-soft);border-radius:11px;padding:3px;gap:2px;}
.seg button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);}
.seg button.on{background:var(--accent-soft);color:#c9c2ff;box-shadow:inset 0 0 0 1px #8b7bff44;}
.switch{width:46px;height:27px;border-radius:99px;background:#2b3145;position:relative;transition:.2s;flex:0 0 46px;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#8e96ab;transition:.2s;}
.switch.on{background:#6b5bff;}
.switch.on::after{left:22px;background:#fff;}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:26px;background:transparent;}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:#2b3145;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:0;}
input[type=time],input[type=date]{
  background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px;font-size:14px;color:var(--text);
}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.7);}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;}
.note b{color:var(--text-2);font-weight:600;}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:5px 0;}
.kv b{color:var(--text-2);font-weight:600;}

/* ---------- 하단 탭 ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:520px;margin:0 auto;
  display:flex;background:rgba(10,12,19,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
  padding-bottom:var(--safe-b);
  height:calc(var(--tab-h) + var(--safe-b));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#5f6779;font-size:10px;font-weight:600;letter-spacing:.2px;
}
.tabbar button .ic{font-size:17px;line-height:1;opacity:.75;}
.tabbar button.on{color:var(--text);}
.tabbar button.on .ic{opacity:1;}
body.sleeping .tabbar,body.sleeping .topbar{display:none;}
body.sleeping #app{padding-bottom:0;}

/* ---------- 모달/토스트 ---------- */
#modal{
  position:fixed;inset:0;z-index:90;background:rgba(4,5,10,.72);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + var(--safe-b));
}
#modal.on{display:flex;animation:fadeIn .16s;}
.modal-box{
  width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:20px;
}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px;}
.modal-text{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px;white-space:pre-line;}
.modal-actions{display:flex;gap:8px;}
.modal-actions .btn{flex:1;padding:13px;}
#toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 18px);transform:translate(-50%,12px);
  background:#232838;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.22s;z-index:95;max-width:calc(100% - 40px);text-align:center;
  box-shadow:0 8px 24px #0009;
}
#toast.on{opacity:1;transform:translate(-50%,0);}

/* ---------- 마이크 테스트 ---------- */

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="moon">🌙</span><span>수면·코골이<small>이 기기에만 저장</small></span></div>
    <div class="actions">

      <button class="icon-btn" id="btn-tab-settings" title="설정">⚙️</button>

  <main>

      </div>

      <div class="card tight" id="home-alarm-card">

        <div id="home-alarm-info" class="note"></div>
      </div>

        <div class="start-sub">마이크 권한이 필요해요 · 화면은 밤새 켜 둡니다</div>
      </div>

    <!-- 리포트 -->

  <nav class="tabbar">

<script>
/* ============================================================
   수면·코골이 트래커 — 개인용 (데이터는 이 브라우저에만 저장)
   Part 1. 유틸 · 저장소 · 마이크 분석 엔진
   ============================================================ */
(function () {
  'use strict';

  /* ---------- 짧은 유틸 ---------- */
  var $ = function (sel) { return document.querySelector(sel); };
  var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function fmtHM(ms) {
    var m = Math.floor(ms / 60000);
    var h = Math.floor(m / 60);
    m = m % 60;
    if (h > 0) return h + '시간 ' + m + '분';
    return m + '분';
  }
  function fmtHMshort(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    var h = Math.floor(m / 60);
    m = m % 60;
    if (h > 0) return h + '시간 ' + m + '분';
    return m + '분';
  }
  function fmtLen(ms) {
    var s = Math.round(ms / 1000);
    if (s < 60) return s + '초';
    return fmtHMshort(ms);
  }
  function fmtMS(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return pad2(m) + ':' + pad2(s);
  }
  function fmtClock(d) {
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDurClock(ms) {
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    return pad2(h) + ':' + pad2(m) + ':' + pad2(s % 60);
  }
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateFull(d) {
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
  }
  function fmtTimeOfDay(d) {
    var h = d.getHours();
    var ampm = h < 12 ? '오전' : '오후';
    var hh = h % 12; if (hh === 0) hh = 12;
    return ampm + ' ' + hh + ':' + pad2(d.getMinutes());
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function dayKey(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, ms) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('on'); }, ms || 2200);
  }
  function haptic(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { /* noop */ }
  }

  /* ---------- 확인 모달 ---------- */
  var modalResolve = null;
  function ask(title, text, buttons) {
    return new Promise(function (resolve) {
      var m = $('#modal');
      $('#modal-title').textContent = title;
      $('#modal-text').textContent = text || '';
      var wrap = $('#modal-actions');
      wrap.innerHTML = '';
      (buttons || [{ label: '확인', value: true, primary: true }]).forEach(function (b) {
        var el = document.createElement('button');
        el.className = 'btn ' + (b.primary ? 'primary' : 'ghost');
        el.textContent = b.label;
        el.addEventListener('click', function () {
          m.classList.remove('on');
          modalResolve = null;
          resolve(b.value);
        });
        wrap.appendChild(el);
      });
      modalResolve = resolve;
      m.classList.add('on');
    });
  }
  function closeModal() {
    $('#modal').classList.remove('on');
    if (modalResolve) { var r = modalResolve; modalResolve = null; r(false); }
  }

  /* ---------- IndexedDB ---------- */
  var DB_NAME = 'sleep-snore-db';
  var DB_VER = 1;
  var _db = null;

  function openDB() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('이 브라우저는 IndexedDB를 지원하지 않습니다.')); return; }
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('sessions')) {
          var s = db.createObjectStore('sessions', { keyPath: 'id' });
          s.createIndex('startedAt', 'startedAt');
        }
        if (!db.objectStoreNames.contains('clips')) {
          var c = db.createObjectStore('clips', { keyPath: 'id' });
          c.createIndex('sessionId', 'sessionId');
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
        if (!db.objectStoreNames.contains('active')) {
          db.createObjectStore('active', { keyPath: 'id' });
        }
      };
      req.onsuccess = function () { _db = req.result; resolve(_db); };
      req.onerror = function () { reject(req.error || new Error('DB 열기 실패')); };
    });
  }

  function dbPut(store, val) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val);
        tx.oncomplete = function () { res(val); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function dbGet(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).get(key);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function dbAll(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).getAll();
        rq.onsuccess = function () { res(rq.result || []); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function dbDel(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbClear(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).clear();
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbByIndex(store, index, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).index(index).getAll(key);
        rq.onsuccess = function () { res(rq.result || []); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function dbCount(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).count();
        rq.onsuccess = function () { res(rq.result || 0); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }

  /* ---------- 설정 ---------- */
  var SENS = {
    '낮음': { snore: 64, trig: 69, ratio: 0.52, clip: 71 },
    '보통': { snore: 57, trig: 62, ratio: 0.42, clip: 65 },
    '높음': { snore: 50, trig: 55, ratio: 0.34, clip: 58 }
  };
  var DEFAULTS = {
    sensitivity: '보통',
    calib: 0,
    dim: 0.85,
    clipsOn: true,
    maxClips: 60,
    clipPre: 2500,
    clipPost: 4500,
    alarmOn: false,
    alarmTarget: '07:00',
    alarmWindow: 20,
    reduceMotion: false,
    hideSeconds: false,
    savedTags: []
  };
  var settings = {};
  function loadSettings() {
    return dbGet('settings', 'app').then(function (rec) {
      settings = Object.assign({}, DEFAULTS, (rec && rec.value) || {});
      return settings;
    }).catch(function () {
      settings = Object.assign({}, DEFAULTS);
      return settings;
    });
  }
  function saveSettings() {
    return dbPut('settings', { key: 'app', value: settings }).catch(function () { /* noop */ });
  }
  function sens() { return SENS[settings.sensitivity] || SENS['보통']; }

  /* ---------- 마이크 분석 엔진 ---------- */
  var AE = {
    ctx: null,
    stream: null,
    src: null,
    analyser: null,
    proc: null,
    mute: null,
    timeBuf: null,
    freqBuf: null,
    ring: null,
    ringLen: 0,
    ringPos: 0,
    sr: 44100,
    audioStart: 0,
    ready: false,

    ensure: function () {
      var self = this;
      if (self.ready && self.ctx) {
        if (self.ctx.state === 'suspended') { self.ctx.resume(); }
        return Promise.resolve(true);
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.reject(new Error('이 브라우저에서는 마이크를 쓸 수 없어요. https 주소로 열었는지 확인해 주세요.'));
      }
      var constraints = {
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1
        },
        video: false
      };
      return navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
        self.stream = stream;
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) throw new Error('Web Audio를 지원하지 않는 브라우저예요.');
        self.ctx = new Ctx();
        return self.ctx.resume().catch(function () { });
      }).then(function () {
        self.sr = self.ctx.sampleRate;
        // 전화·알림 등으로 오디오가 중단되면 측정 중일 때 자동 재개
        self.ctx.onstatechange = function () {
          if (self.ctx && self.ctx.state !== 'running' && self.ctx.state !== 'closed' && typeof Rec !== 'undefined' && Rec.active) {
            self.ctx.resume().catch(function () { });
          }
        };
        self.src = self.ctx.createMediaStreamSource(self.stream);
        self.analyser = self.ctx.createAnalyser();
        self.analyser.fftSize = 2048;
        self.analyser.smoothingTimeConstant = 0.35;
        self.src.connect(self.analyser);
        self.timeBuf = new Float32Array(self.analyser.fftSize);
        self.freqBuf = new Float32Array(self.analyser.frequencyBinCount);

        self.ringLen = Math.round(self.sr * 16);
        self.ring = new Float32Array(self.ringLen);
        self.ringPos = 0;

        self.proc = self.ctx.createScriptProcessor(4096, 1, 1);
        self.proc.onaudioprocess = function (e) {
          var input = e.inputBuffer.getChannelData(0);
          var r = self.ring, L = self.ringLen, p = self.ringPos, i;
          for (i = 0; i < input.length; i++) { r[p] = input[i]; p++; if (p >= L) p = 0; }
          self.ringPos = p;
        };
        self.src.connect(self.proc);
        self.mute = self.ctx.createGain();
        self.mute.gain.value = 0;
        self.proc.connect(self.mute);
        self.mute.connect(self.ctx.destination);
        self.audioStart = Date.now();
        self.ready = true;
        return true;
      }).catch(function (err) {
        self.release();
        throw err;
      });
    },

    release: function () {
      try { if (this.proc) { this.proc.onaudioprocess = null; this.proc.disconnect(); } } catch (e) { }
      try { if (this.mute) this.mute.disconnect(); } catch (e) { }
      try { if (this.src) this.src.disconnect(); } catch (e) { }
      try { if (this.stream) { this.stream.getTracks().forEach(function (t) { t.stop(); }); } } catch (e) { }
      try { if (this.ctx && this.ctx.state !== 'closed') this.ctx.close(); } catch (e) { }
      this.ctx = null; this.stream = null; this.src = null; this.analyser = null;
      this.proc = null; this.mute = null; this.ring = null; this.ready = false;
    },

    analyse: function () {
      if (!this.analyser) return null;
      var tb = this.timeBuf, i, v, sum = 0, peak = 0;
      this.analyser.getFloatTimeDomainData(tb);
      for (i = 0; i < tb.length; i++) {
        v = tb[i];
        sum += v * v;
        if (v < 0) v = -v;
        if (v > peak) peak = v;
      }
      var rms = Math.sqrt(sum / tb.length);
      var dbfs = 20 * Math.log(rms + 1e-9) / Math.LN10;
      var db = dbfs + 90 + (settings.calib || 0);

      var fb = this.freqBuf;
      this.analyser.getFloatFrequencyData(fb);
      var binHz = this.sr / this.analyser.fftSize;
      var low = 0, mid = 0, high = 0, total = 0;
      for (i = 1; i < fb.length; i++) {
        var hz = i * binHz;
        if (hz > 9000) break;
        var mag = Math.pow(10, fb[i] / 20);
        total += mag;
        if (hz >= 65 && hz <= 450) low += mag;
        else if (hz > 450 && hz <= 2000) mid += mag;
        else if (hz > 2000) high += mag;
      }
      var lowRatio = total > 0 ? low / total : 0;
      return {
        db: clamp(db, 0, 120),
        peakDb: clamp(20 * Math.log(peak + 1e-9) / Math.LN10 + 90 + (settings.calib || 0), 0, 120),
        lowRatio: lowRatio,
        rms: rms
      };
    },

    /* 타임스탬프(ms) 구간의 PCM을 꺼낸다 */
    read: function (t0, t1) {
      if (!this.ring) return new Float32Array(0);
      var sr = this.sr;
      var total = Math.floor((Date.now() - this.audioStart) / 1000 * sr);
      var availStart = Math.max(0, total - this.ringLen + Math.round(sr * 0.2));
      var s0 = clamp(Math.round((t0 - this.audioStart) / 1000 * sr), availStart, total);
      var s1 = clamp(Math.round((t1 - this.audioStart) / 1000 * sr), s0, total);
      var n = s1 - s0;
      var out = new Float32Array(n);
      var L = this.ringLen, r = this.ring;
      for (var i = 0; i < n; i++) {
        var idx = (s0 + i) % L;
        out[i] = r[idx];
      }
      return out;
    }
  };

  /* ---------- WAV 인코더 (16bit PCM 모노) ---------- */
  function downsample(buf, fromRate, toRate) {
    if (toRate >= fromRate) return buf;
    var ratio = fromRate / toRate;
    var n = Math.max(1, Math.floor(buf.length / ratio));
    var out = new Float32Array(n);
    var i, j, acc, cnt, pos;
    for (i = 0; i < n; i++) {
      acc = 0; cnt = 0;
      var start = Math.floor(i * ratio);
      var end = Math.min(buf.length, Math.floor((i + 1) * ratio));
      for (j = start; j < end; j++) { acc += buf[j]; cnt++; }
      out[i] = cnt > 0 ? acc / cnt : 0;
    }
    return out;
  }

  function encodeWav(samples, sampleRate) {
    var n = samples.length;
    var bytes = 44 + n * 2;
    var ab = new ArrayBuffer(bytes);
    var view = new DataView(ab);
    function wstr(off, s) {
      for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
    }
    wstr(0, 'RIFF');
    view.setUint32(4, bytes - 8, true);
    wstr(8, 'WAVE');
    wstr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);          // PCM
    view.setUint16(22, 1, true);          // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    wstr(36, 'data');
    view.setUint32(40, n * 2, true);
    var off = 44, v;
    for (var i = 0; i < n; i++) {
      v = samples[i];
      if (v > 1) v = 1; else if (v < -1) v = -1;
      view.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      off += 2;
    }
    return new Blob([ab], { type: 'audio/wav' });
  }

  function makeClipBlob(t0, t1) {
    var raw = AE.read(t0, t1);
    if (!raw || raw.length < 200) return null;
    var ds = downsample(raw, AE.sr, 16000);
    return encodeWav(ds, 16000);
  }

  /* ---------- 마이크 권한 확인 ---------- */
  function isSecure() {
    return window.isSecureContext === true;
  }

  /* part1 끝 */

  /* ============================================================
     Part 2. 측정 세션 · 클립 · 알람 · 데모 데이터
     ============================================================ */

  /* ---------- 화면 켜짐 유지 ---------- */
  var Wake = {
    lock: null,
    supported: !!(navigator.wakeLock && navigator.wakeLock.request),
    request: function () {
      var self = this;
      if (!self.supported) return Promise.resolve(false);
      return navigator.wakeLock.request('screen').then(function (lock) {
        self.lock = lock;
        lock.addEventListener('release', function () { self.lock = null; });
        return true;
      }).catch(function () { return false; });
    },
    release: function () {
      try { if (this.lock) this.lock.release(); } catch (e) { }
      this.lock = null;
    }
  };

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Rec.active) {
      if (!Wake.lock) Wake.request();
      // 화면이 잠깐 꺼졌다 돌아오면 오디오가 멈춰 있을 수 있어 다시 깨운다
      if (AE.ctx && AE.ctx.state !== 'running' && AE.ctx.state !== 'closed') {
        AE.ctx.resume().catch(function () { });
      }
    }
  });

  /* ---------- 알람 소리 ---------- */
  var Alarm = {
    ctx: null,
    gain: null,
    timer: null,
    active: false,
    ringTimer: null,
    start: function () {
      var self = this;
      if (self.active) return;
      self.active = true;
      var Ctx = window.AudioContext || window.webkitAudioContext;
      // 이미 돌고 있는 컨텍스트가 있으면 그대로 사용 (자동재생 정책 회피)
      if (AE.ready && AE.ctx && AE.ctx.state === 'running') {
        self.ctx = AE.ctx;
        self.ownsCtx = false;
      } else {
        if (!Ctx) { self.active = false; return; }
        self.ctx = new Ctx();
        self.ownsCtx = true;
      }
      self.gain = self.ctx.createGain();
      self.gain.gain.value = 0.0;
      self.gain.connect(self.ctx.destination);
      self.ctx.resume().catch(function () { });
      var t0 = Date.now();

      function chime() {
        if (!self.active) return;
        var now = self.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach(function (f, idx) {
          var o = self.ctx.createOscillator();
          var g = self.ctx.createGain();
          o.type = 'sine';
          o.frequency.value = f;
          var st = now + idx * 0.16;
          g.gain.setValueAtTime(0, st);
          g.gain.linearRampToValueAtTime(0.9, st + 0.12);
          g.gain.exponentialRampToValueAtTime(0.001, st + 1.5);
          o.connect(g); g.connect(self.gain);
          o.start(st); o.stop(st + 1.6);
        });
        var elapsed = (Date.now() - t0) / 1000;
        var vol = clamp(0.06 + elapsed * 0.012, 0.06, 0.55);
        self.gain.gain.setTargetAtTime(vol, self.ctx.currentTime, 0.6);
      }
      chime();
      self.timer = setInterval(chime, 3400);
      self.buzz();
    },
    buzz: function () {
      var self = this;
      if (!navigator.vibrate) return;
      try { navigator.vibrate([300, 200, 300, 600]); } catch (e) { }
      self.ringTimer = setInterval(function () {
        if (!self.active) return;
        try { navigator.vibrate([300, 200, 300, 600]); } catch (e) { }
      }, 6000);
    },
    stop: function () {
      this.active = false;
      clearInterval(this.timer);
      clearInterval(this.ringTimer);
      this.timer = null; this.ringTimer = null;
      var c = this.ctx, g = this.gain, own = this.ownsCtx;
      if (g) { try { g.gain.setTargetAtTime(0, c.currentTime, 0.25); } catch (e) { } }
      if (c && own) { setTimeout(function () { try { c.close(); } catch (e) { } }, 800); }
      this.ctx = null; this.gain = null; this.ownsCtx = false;
      try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) { }
    }
  };

  /* ---------- 점수/분류 ---------- */
  function gradeOf(score) {
    if (score < 15) return { label: '아주 조용했어요', cls: 'good', color: '#4ad6a0' };
    if (score < 35) return { label: '가벼운 코골이', cls: 'good', color: '#4ad6a0' };
    if (score < 60) return { label: '코골이가 있었어요', cls: 'mid', color: '#f2b45c' };
    return { label: '코골이가 심했어요', cls: 'bad', color: '#ff6b81' };
  }

  function scoreOf(s) {
    if (!s) return 0;
    var snoreSec = s.snoreSeconds || 0;
    var noisy = s.noisyMinutes || 0;
    var clips = s.clipCount || 0;
    var dur = s.durationMs || 0;
    var ratio = dur > 0 ? (snoreSec * 1000 / dur) : 0;
    var raw = (snoreSec / 60) * 1.7 + noisy * 0.55 + clips * 0.9 +
      Math.max(0, ratio * 100 - 15) * 0.25;
    return clamp(Math.round(raw), 0, 100);
  }

  function summarize(s) {
    var deep = 0, light = 0, noisy = 0, snore = 0;
    (s.epochs || []).forEach(function (e) {
      if (e.cls === 'deep') deep++;
      else if (e.cls === 'light') light++;
      else if (e.cls === 'noise') noisy++;
      else if (e.cls === 'snore') snore++;
    });
    s.deepMinutes = deep;
    s.lightMinutes = light + snore;
    s.noisyMinutes = noisy;
    s.score = scoreOf(s);
    s.grade = gradeOf(s.score).label;
    return s;
  }

  function classifyEpoch(e) {
    if (!e || !e.n) return 'light';
    var avg = e.dbSum / e.n;
    if (e.snore >= 6) return 'snore';
    if (e.events >= 3 || avg >= 58) return 'noise';
    if (avg <= 42 && (e.maxDb - avg) <= 12) return 'deep';
    return 'light';
  }

  /* ---------- 녹음 세션 ---------- */
  var Rec = {
    active: false,
    session: null,
    epoch: null,
    epochIndex: 0,
    snoreSec: 0,
    snoreOn: false,
    snoreStart: 0,
    onsets: [],
    lastOnset: 0,
    events: 0,
    lastEvent: 0,
    clips: 0,
    clipBytes: 0,
    lastClipEnd: 0,
    clipPending: null,
    prevDb: 0,
    timer: null,
    alarmFired: false,
    alarmAt: 0,
    lastMoveTs: 0,
    dim: 0.9,
    startedWall: 0
  };

  function newEpoch(i) {
    return { i: i, dbSum: 0, n: 0, maxDb: 0, snore: 0, events: 0 };
  }

  function flushEpoch(force) {
    var e = Rec.epoch;
    if (!e || e.n === 0) {
      if (force) Rec.epoch = newEpoch(Rec.epochIndex);
      return;
    }
    var rec = {
      i: e.i,
      avgDb: Math.round((e.dbSum / e.n) * 10) / 10,
      maxDb: Math.round(e.maxDb * 10) / 10,
      snore: Math.round(e.snore * 10) / 10,
      events: e.events,
      cls: classifyEpoch(e)
    };
    (Rec.session.epochs = Rec.session.epochs.concat([rec]));
    Rec.epoch = newEpoch(Rec.epochIndex);
    persistActive();
  }

  function persistActive() {
    if (!Rec.active || !Rec.session) return Promise.resolve();
    var s = Rec.session;
    var snap = {
      id: 'active',
      updatedAt: Date.now(),
      elapsedMs: Date.now() - s.startedAt,
      session: {
        id: s.id, startedAt: s.startedAt, tags: s.tags, memo: s.memo,
        epochs: s.epochs, snoreSeconds: Math.round(Rec.snoreSec),
        events: Rec.events, clipCount: Rec.clips, demo: false
      }
    };
    return dbPut('active', snap).catch(function () { });
  }

  function maybeClip(now, a, S) {
    if (!settings.clipsOn) return;
    if (Rec.clipPending) return;
    if (Rec.clips >= (settings.maxClips || 60)) return;
    if (Rec.clipBytes > 45 * 1024 * 1024) return;
    if (now - Rec.lastClipEnd < 18000) return;
    if (a.db < S.clip) return;
    Rec.clipPending = { trigger: now, peak: a.db };
  }

  function capturePendingClip(now) {
    var p = Rec.clipPending;
    if (!p) return;
    if (now - p.trigger < settings.clipPost) return;
    Rec.clipPending = null;
    var t0 = p.trigger - settings.clipPre;
    var t1 = p.trigger + settings.clipPost;
    var blob = makeClipBlob(t0, Math.min(t1, Date.now()));
    if (!blob) return;
    var clip = {
      id: uid('clip'),
      sessionId: Rec.session.id,
      startAt: t0,
      durationMs: t1 - t0,
      peakDb: Math.round(p.peak),
      mime: 'audio/wav',
      size: blob.size,
      demo: false,
      blob: blob
    };
    Rec.clips++;
    Rec.clipBytes += blob.size;
    Rec.lastClipEnd = now;
    dbPut('clips', clip).catch(function () { });
    var el = $('#sleep-clips');
    if (el) el.textContent = Rec.clips + '개';
    haptic(8);
  }

  function computeAlarmAt() {
    if (!settings.alarmOn) return 0;
    var parts = String(settings.alarmTarget || '07:00').split(':');
    var h = parseInt(parts[0], 10) || 7;
    var m = parseInt(parts[1], 10) || 0;
    var base = new Date(Rec.session.startedAt);
    var t = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0, 0);
    if (t.getTime() <= Rec.session.startedAt + 120000) t.setDate(t.getDate() + 1);
    return t.getTime();
  }

  function checkAlarm(now, a) {
    if (!settings.alarmOn || !Rec.alarmAt) return;
    if (Rec.alarmFired) return;
    var target = Rec.alarmAt;
    var winMs = (settings.alarmWindow || 20) * 60000;
    var winStart = target - winMs;
    if (now < winStart) return;
    var inWindow = now < target;
    var recentMove = (now - Rec.lastMoveTs) < 180000;
    var calmNow = a.db < sens().snore + 4;
    if (now >= target || (inWindow && recentMove && calmNow)) {
      Rec.alarmFired = true;
      fireAlarm(now >= target ? 'target' : 'smart');
    }
  }

  function fireAlarm(reason) {
    haptic([180, 90, 180]);
    Alarm.start();
    $('#wake-overlay').classList.add('on');
    var d = new Date();
    $('#wake-time').textContent = fmtClock(d);
    $('#wake-msg').textContent = reason === 'smart'
      ? '얕은 수면이 감지되어 부드럽게 깨워드리고 있어요'
      : '설정하신 기상 시간이에요. 좋은 아침이에요!';
  }

  /* ---------- 실시간 틱 ---------- */
  function tick() {
    if (!Rec.active) return;
    var now = Date.now();
    var a = AE.analyse();
    if (!a) return;
    var S = sens();

    // 1분 에폭 누적
    var elapsed = now - Rec.session.startedAt;
    var idx = Math.floor(elapsed / 60000);
    if (idx > Rec.epochIndex) {
      flushEpoch(false);
      Rec.epochIndex = idx;
      Rec.epoch = newEpoch(idx);
    }
    var e = Rec.epoch;
    e.dbSum += a.db; e.n++;
    if (a.db > e.maxDb) e.maxDb = a.db;

    // 코골이 판정 (저역 비중 + 음량 + 지속)
    var loud = a.db >= S.snore;
    var lowish = a.lowRatio >= S.ratio;
    var isSnoreFrame = loud && lowish;
    if (isSnoreFrame) {
      if (!Rec.snoreOn) { Rec.snoreOn = true; Rec.snoreStart = now; }
      Rec.snoreSec += 0.1;
      e.snore += 0.1;
      if (now - Rec.lastOnset > 900) {
        Rec.lastOnset = now;
        Rec.onsets.push(now);
        if (Rec.onsets.length > 10) Rec.onsets.shift();
        updateRhythm();
      }
    } else if (Rec.snoreOn) {
      if (now - Rec.snoreStart < 300) { Rec.snoreSec -= 0.1; e.snore -= 0.1; }
      Rec.snoreOn = false;
    }

    // 큰 소리/움직임 이벤트
    var jumped = a.db - Rec.prevDb;
    if (a.db >= S.trig && (jumped > 5 || now - Rec.lastEvent > 3000)) {
      if (now - Rec.lastEvent > 2500) {
        if (!(isSnoreFrame && Rec.snoreOn)) {
          Rec.events++;
          e.events++;
          Rec.lastMoveTs = now;
          haptic(6);
        } else {
          Rec.lastMoveTs = now;
        }
        Rec.lastEvent = now;
      }
    }
    Rec.prevDb = a.db;

    maybeClip(now, a, S);
    if (Rec.clipPending) capturePendingClip(now);
    checkAlarm(now, a);
    paintLive(a, now);
  }

  /* 호흡 주기(1~8초)로 반복되는지 — 주기적 리듬 코골이 판정 */
  function updateRhythm() {
    var o = Rec.onsets;
    if (o.length < 4) return;
    var iv = [], i;
    for (i = 1; i < o.length; i++) iv.push(o[i] - o[i - 1]);
    var sorted = iv.slice().sort(function (a, b) { return a - b; });
    var med = sorted[Math.floor(sorted.length / 2)];
    if (med < 1000 || med > 8000) return;
    var mean = iv.reduce(function (a, b) { return a + b; }, 0) / iv.length;
    var sd = Math.sqrt(iv.reduce(function (a, v) { return a + (v - mean) * (v - mean); }, 0) / iv.length);
    if (mean > 0 && sd / mean < 0.45) Rec.rhythm = true;
  }

  function paintLive(a, now) {
    var S = sens();
    var el = $('#sleep-db');
    if (el) el.textContent = Math.round(a.db);
    var bar = $('#sleep-meter-fill');
    if (bar) {
      bar.style.width = clamp((a.db - 20) / 70 * 100, 2, 100) + '%';
      if (a.db >= S.snore && a.lowRatio >= S.ratio) bar.classList.add('snore');
      else bar.classList.remove('snore');
    }
    var st = $('#sleep-status');
    if (st) {
      var txt = '조용함', cls = 'calm';
      if (a.db >= S.snore && a.lowRatio >= S.ratio) { txt = '코골이 감지'; cls = 'snore'; }
      else if (a.db >= S.trig) { txt = '큰 소리·움직임'; cls = 'noise'; }
      else if (a.db >= S.snore) { txt = '숨소리'; cls = 'calm'; }
      if (st.textContent !== txt) st.textContent = txt;
      st.className = 'sleep-status ' + cls;
    }
    var ct = $('#sleep-clock');
    if (ct) {
      var d = new Date(now);
      ct.textContent = fmtClock(d);
    }
    var da = $('#sleep-date');
    if (da && da.textContent !== fmtDateFull(new Date(now))) da.textContent = fmtDateFull(new Date(now));
    var el2 = $('#sleep-elapsed');
    if (el2) el2.textContent = fmtDurClock(now - Rec.session.startedAt) + ' 경과';
    var sn = $('#sleep-snoretime');
    if (sn) sn.textContent = fmtLen(Rec.snoreSec * 1000);
    var ev = $('#sleep-events');
    if (ev) ev.textContent = Rec.events + '회';
  }

  /* ---------- 시작/종료 ---------- */
  function startSession(opts) {
    opts = opts || {};
    var now = Date.now();
    Rec.session = {
      id: uid('ses'),
      startedAt: now,
      endedAt: null,
      tags: (opts.tags || []).slice(),
      memo: opts.memo || '',
      epochs: [],
      snoreSeconds: 0,
      events: 0,
      clipCount: 0,
      demo: false,
      sensitivity: settings.sensitivity,
      alarm: settings.alarmOn ? { target: settings.alarmTarget, window: settings.alarmWindow } : null
    };
    Rec.epochIndex = 0;
    Rec.epoch = newEpoch(0);
    Rec.snoreSec = 0; Rec.snoreOn = false; Rec.onsets = []; Rec.events = 0;
    Rec.clips = 0; Rec.clipBytes = 0; Rec.lastClipEnd = 0; Rec.clipPending = null;
    Rec.prevDb = 0; Rec.alarmFired = false; Rec.lastMoveTs = 0; Rec.rhythm = false;
    Rec.startedWall = now;
    Rec.active = true;
    Rec.alarmAt = computeAlarmAt();

    document.body.classList.add('sleeping');
    $('#sleep-stage').classList.remove('hidden');
    setView('sleep');
    applyDim();
    Wake.request().then(function (ok) {
      var el = $('#sleep-wakelock');

    });
    var stEl = $('#sleep-tags');
    if (stEl) {
      stEl.textContent = (Rec.session.tags || []).map(function (id) {
        var t = TAGMAP[id];
        return t ? t.em + ' ' + t.label : '';
      }).filter(Boolean).join(' · ');
    }
    Rec.timer = setInterval(tick, 100);
    rotateTimer = setInterval(shiftStage, 60000);

  }

  function stopSession(save) {
    if (!Rec.active) return Promise.resolve(null);
    Rec.active = false;
    clearInterval(Rec.timer);
    clearInterval(rotateTimer);
    Rec.timer = null;
    Alarm.stop();
    $('#wake-overlay').classList.remove('on');
    Wake.release();
    document.body.classList.remove('sleeping');
    $('#sleep-stage').classList.add('hidden');

    var s = Rec.session;
    flushEpoch(true);
    s.endedAt = Date.now();
    s.snoreSeconds = Math.round(Rec.snoreSec);
    s.events = Rec.events;
    s.clipCount = Rec.clips;
    s.durationMs = s.endedAt - s.startedAt;
    s.rhythm = !!Rec.rhythm;
    summarize(s);
    closeLiveObjects();

    if (!save) {
      return dbDel('active', 'active').then(function () { return null; });
    }
    return dbPut('sessions', s).then(function () {
      return dbDel('active', 'active');
    }).then(function () {
      return dbByIndex('clips', 'sessionId', s.id);
    }).then(function (clips) {
      // 저장된 클립이 IDB 기준과 다르면 세션 카운트 보정
      if (clips && clips.length !== s.clipCount) {
        s.clipCount = clips.length;
        summarize(s);
        return dbPut('sessions', s);
      }
      return s;
    }).then(function () {
      return s;
    });
  }

  /* ---------- 화면 잔상 방지: 미세 이동 ---------- */
  var rotateTimer = null;
  var rotateStep = 0;
  function shiftStage() {
    if (!Rec.active) return;
    if (settings.reduceMotion) return;
    rotateStep++;
    var x = (rotateStep % 2 === 0 ? 4 : -4);
    var y = (rotateStep % 3 === 0 ? 3 : -2);
    var el = $('#sleep-content');
    if (el) {
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      el.style.opacity = (0.9 + (rotateStep % 3) * 0.05).toFixed(2);
    }
    var st = $('#sleep-stage');
    if (st) st.style.background = rotateStep % 4 === 0 ? '#010103' : '#000';
  }

  function applyDim() {
    var ov = $('#dim-overlay');
    if (!ov) return;
    ov.style.opacity = String(settings.dim);
    var btn = $('#btn-dim');
    if (btn) btn.textContent = '어둡게 ' + Math.round(settings.dim * 100) + '%';
  }

  /* ---------- 데모(샘플) 데이터 ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function synthSnore(seed, seconds) {
    var sr = 16000;
    var n = Math.round(sr * seconds);
    var buf = new Float32Array(n);
    var phase = 0, lp = 0;
    for (var i = 0; i < n; i++) {
      var t = i / sr;
      var cyc = t % 1.15;
      var env = 0;
      if (cyc < 0.58) { env = Math.sin(Math.PI * (cyc / 0.58)); env = env * env; }
      var f = 98 + 26 * Math.sin(t * 0.9 + seed);
      phase += 2 * Math.PI * f / sr;
      var saw = ((phase / (2 * Math.PI)) % 1);
      saw = 2 * saw - 1;
      lp = lp * 0.72 + saw * 0.28;
      var v = (lp * 0.75 + Math.sin(phase) * 0.25) * env * 0.5;
      v += (Math.random() - 0.5) * 0.015 * env;
      buf[i] = v;
    }
    return encodeWav(buf, sr);
  }

  function buildDemoSession(cfg) {
    var rnd = mulberry32(cfg.seed);
    var start = cfg.startAt;
    var mins = cfg.minutes;
    var epochs = [];
    var snoreSec = 0, events = 0, clips = 0;
    // 코골이 구간(에폭 인덱스) 몇 덩어리
    var blocks = [];
    var remain = cfg.snoreMinutes;
    var guard = 0;
    while (remain > 0 && guard < 40) {
      guard++;
      var len = Math.min(remain, 4 + Math.floor(rnd() * 12));
      var at = 20 + Math.floor(rnd() * (mins - 40));
      if (at + len > mins - 5) at = Math.max(10, mins - len - 8);
      blocks.push([at, at + len]);
      remain -= len;
    }
    blocks.sort(function (x, y) { return x[0] - y[0]; });
    var bi = 0;
    for (var i = 0; i < mins; i++) {
      var inBlock = bi < blocks.length && i >= blocks[bi][0] && i < blocks[bi][1];
      if (bi < blocks.length && i >= blocks[bi][1]) bi++;
      var base = 34 + 4 * Math.sin(i / 37 + cfg.seed) + rnd() * 2.4;
      var snore = 0, ev = 0, maxDb = base + 6 + rnd() * 5, cls, avgVal = base;
      if (inBlock) {
        snore = 45 + rnd() * 15;
        snoreSec += snore;
        avgVal = 46 + rnd() * 12;
        maxDb = 58 + rnd() * 14;
        cls = 'snore';
      } else if (rnd() < cfg.noiseRate) {
        ev = 1 + Math.floor(rnd() * 3);
        events += ev;
        avgVal = 48 + rnd() * 8;
        maxDb = 52 + rnd() * 12;
        cls = 'noise';
      } else {
        var quiet = 32 + rnd() * 7;
        avgVal = quiet;
        cls = (quiet < 36.5 ? 'deep' : 'light');
        maxDb = quiet + 4 + rnd() * 6;
      }
      epochs.push({
        i: i,
        avgDb: Math.round(avgVal * 10) / 10,
        maxDb: Math.round(maxDb * 10) / 10,
        snore: Math.round(snore * 10) / 10,
        events: ev,
        cls: cls
      });
    }
    var endAt = start + mins * 60000;
    return {
      id: uid('demo'),
      startedAt: start,
      endedAt: endAt,
      durationMs: mins * 60000,
      tags: cfg.tags,
      memo: cfg.memo || '',
      epochs: epochs,
      snoreSeconds: Math.round(snoreSec),
      events: events,
      clipCount: 0,
      rhythm: cfg.snoreMinutes >= 15,
      demo: true,
      sensitivity: '보통',
      alarm: { target: cfg.wakeAt, window: 20 }
    };
  }

  function demoConfigs() {
    var now = new Date();
    function nightAgo(n, h, m) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - n, h, m, 0, 0);
      return d.getTime();
    }
    return [
      {
        seed: 7, startAt: nightAgo(3, 22, 50), minutes: 458, snoreMinutes: 9, noiseRate: 0.05,
        tags: ['exercise', 'caffeine'], memo: '운동하고 11시 전에 잠. 코는 편했음',
        wakeAt: '06:30', clipTargets: [96, 210]
      },
      {
        seed: 21, startAt: nightAgo(2, 23, 40), minutes: 442, snoreMinutes: 38, noiseRate: 0.09,
        tags: ['alcohol', 'latenight'], memo: '회식 후 삼겹살, 자기 전 물 많이 마심',
        wakeAt: '07:10', clipTargets: [58, 92, 151, 260, 330]
      },
      {
        seed: 41, startAt: nightAgo(1, 0, 25), minutes: 388, snoreMinutes: 17, noiseRate: 0.07,
        tags: ['fatigue', 'congestion'], memo: '야근하고 코가 막혀 있었다',
        wakeAt: '06:50', clipTargets: [70, 188, 244]
      }
    ];
  }

  function loadDemo() {
    var list = demoConfigs();
    var totalClips = 0;
    var chain = Promise.resolve();
    list.forEach(function (cfg, idx) {
      chain = chain.then(function () {
        var s = buildDemoSession(cfg);
        var epochSec = 60;
        var targets = cfg.clipTargets || [];
        var jobs = targets.map(function (minIdx, k) {
          var durMs = 4200 + (k % 3) * 900;
          var blob = synthSnore(cfg.seed + k, durMs / 1000);
          var clip = {
            id: uid('clip'),
            sessionId: s.id,
            startAt: s.startedAt + minIdx * epochSec * 1000,
            durationMs: durMs,
            peakDb: 60 + ((cfg.seed + k * 7) % 16),
            mime: 'audio/wav',
            size: blob.size,
            demo: true,
            blob: blob
          };
          totalClips++;
          return dbPut('clips', clip);
        });
        s.clipCount = targets.length;
        return Promise.all(jobs).then(function () {
          summarize(s);
          return dbPut('sessions', s);
        });
      });
    });
    return chain.then(function () {
      return totalClips;
    });
  }

  /* ---------- 기록/인사이트 ---------- */
  function renderHistory() {
    var box = $('#history-body');
    box.innerHTML = '<div class="empty">불러오는 중…</div>';
    dbAll('sessions').then(function (list) {
      list.sort(function (a, b) { return b.startedAt - a.startedAt; });

        return;
      }
      var stats = tagStats(list);
      var real = list.filter(function (s) { return !s.demo; });
      var avgScore = Math.round(list.reduce(function (a, s) { return a + (s.score || 0); }, 0) / list.length);
      var totalSnore = list.reduce(function (a, s) { return a + (s.snoreSeconds || 0); }, 0);
      var avgDur = list.reduce(function (a, s) { return a + (s.durationMs || 0); }, 0) / list.length;

      var html = '';
      html += '<div class="section-title">요약 <span class="more">' + list.length + '일 기록</span></div>';
      html += '<div class="card"><div class="stat-grid">' +
        '<div class="stat"><div class="k">평균 코골이 점수</div><div class="v">' + avgScore + '<small>점</small></div></div>' +
        '<div class="stat"><div class="k">평균 수면 시간</div><div class="v">' + fmtHMshort(avgDur) + '</div></div>' +
        '<div class="stat"><div class="k">하룻밤 평균 코골이</div><div class="v">' + fmtLen(totalSnore / list.length * 1000) + '</div></div>' +
        '<div class="stat"><div class="k">직접 측정한 날</div><div class="v">' + real.length + '<small>일</small></div></div>' +
        '</div></div>';

      if (stats.length) {
        html += '<div class="section-title">요인별 비교 <span class="more">높을수록 코골이 많음</span></div>';
        html += '<div class="card"><div class="card-title">취침 전 요인 <b>있던 날 vs 없던 날</b></div>';
        var maxV = 1;
        stats.forEach(function (t) { maxV = Math.max(maxV, t.withAvg, t.withoutAvg); });
        stats.forEach(function (t) {
          html += '<div class="insight-row">' +
            '<div class="insight-label">' + t.em + ' ' + t.label + '</div>' +
            '<div class="insight-bar">' +
            '<i style="width:' + Math.round(t.withAvg / maxV * 100) + '%;top:3px;height:9px"></i>' +
            '<i class="base" style="width:' + Math.round(t.withoutAvg / maxV * 100) + '%;bottom:3px;height:9px"></i>' +
            '</div>' +
            '<div class="insight-val">' + Math.round(t.withAvg) + '점<small>없던 날 ' + Math.round(t.withoutAvg) + '</small></div>' +
            '</div>';
        });
        html += '<div class="legend" style="margin-top:2px"><span><i style="background:#6a5bff"></i>요인 있던 날</span><span><i style="background:#394056"></i>없던 날</span><span>막대 = 평균 점수</span></div>';
        var best = stats.slice().sort(function (a, b) { return (b.withAvg - b.withoutAvg) - (a.withAvg - a.withoutAvg); })[0];
        if (best && best.diff > 5) {
          html += '<div class="note" style="margin-top:6px">💡 <b>' + best.label + '</b> 있었던 날 코골이 점수가 평균 ' + Math.round(best.diff) + '점 더 높았어요 (' + best.withCount + '일 기록).</div>';
        } else {
          html += '<div class="note" style="margin-top:6px">기록이 더 쌓이면 어떤 요인이 코골이를 늘리는지 비교해서 보여드릴게요.</div>';

      }

      html += '<div class="section-title">하루별 기록</div>';
      html += list.map(rowHTML).join('');
      box.innerHTML = html;
    }).catch(function (e) {
      box.innerHTML = '<div class="empty">기록을 불러오지 못했어요.<br>' + esc(e && e.message ? e.message : '') + '</div>';
    });
  }

  function tagStats(list) {
    var out = [];
    var scored = list.filter(function (s) { return typeof s.score === 'number'; });
    if (!scored.length) return out;
    TAGS.forEach(function (t) {
      var withArr = scored.filter(function (s) { return (s.tags || []).indexOf(t.id) >= 0; });
      var woArr = scored.filter(function (s) { return (s.tags || []).indexOf(t.id) < 0; });
      if (withArr.length === 0) return;
      var withAvg = withArr.reduce(function (a, s) { return a + s.score; }, 0) / withArr.length;
      var withoutAvg = woArr.length ? woArr.reduce(function (a, s) { return a + s.score; }, 0) / woArr.length : 0;
      out.push({
        id: t.id, label: t.label, em: t.em,
        withAvg: withAvg, withoutAvg: withoutAvg,
        withCount: withArr.length, withoutCount: woArr.length,
        diff: withAvg - withoutAvg
      });
    });
    out.sort(function (a, b) { return b.diff - a.diff; });
    return out;
  }

  /* ---------- 리포트 ---------- */

      return dbByIndex('clips', 'sessionId', id).then(function (clips) {
        clips.sort(function (a, b) { return a.startAt - b.startAt; });

        state.reportBack = (state.view === 'home') ? 'home' : 'history';
        $('#report-body').innerHTML = '';
        setView('report');
        renderReport(s, clips);

      toast('불러오기 실패: ' + (e && e.message ? e.message : ''));
    });
  }

  var player = { id: null, audio: null, url: null, btn: null, row: null };

  function stopPlayer() {
    if (player.audio) {
      try { player.audio.pause(); } catch (e) { }
      player.audio = null;
    }
    if (player.url) { URL.revokeObjectURL(player.url); player.url = null; }
    if (player.btn) player.btn.textContent = '▶';
    if (player.row) {

      if (b) b.style.width = '0%';

    player.id = null; player.btn = null; player.row = null;
  }

  function attachClipHandlers(clips) {
    var map = {};
    clips.forEach(function (c) { map[c.id] = c; });
    $$('#clip-list .clip-item').forEach(function (row) {
      var id = row.getAttribute('data-clip');
      var playBtn = row.querySelector('[data-play]');
      var delBtn = row.querySelector('[data-del]');
      playBtn.addEventListener('click', function () {
        var clip = map[id];
        if (!clip) return;
        if (player.id === id) {
          if (player.audio && !player.audio.paused) { player.audio.pause(); playBtn.textContent = '▶'; }
          else if (player.audio) { player.audio.play(); playBtn.textContent = '❚❚'; }
          return;
        }
        stopPlayer();
        var url = URL.createObjectURL(clip.blob);
        var au = new Audio(url);
        player = { id: id, audio: au, url: url, btn: playBtn, row: row };
        playBtn.textContent = '❚❚';
        var bar = row.querySelector('.clip-bar i');
        au.addEventListener('timeupdate', function () {
          if (!au.duration) return;
          bar.style.width = Math.round(au.currentTime / au.duration * 100) + '%';
        });
        au.addEventListener('ended', function () {
          playBtn.textContent = '▶';
          bar.style.width = '0%';
        });
        au.play().catch(function () {
          toast('이 클립을 재생할 수 없어요');
          stopPlayer();
        });
      });
      delBtn.addEventListener('click', function () {
        ask('클립 삭제', '이 코골이 클립을 삭제할까요? 되돌릴 수 없어요.', [
          { label: '취소', value: false },
          { label: '삭제', value: true, primary: true }
        ]).then(function (ok) {
          if (!ok) return;
          stopPlayer();
          dbDel('clips', id).then(function () {
            row.style.opacity = '.35';
            row.style.pointerEvents = 'none';
            var s = state.currentReport;
            if (s) {
              s.clipCount = Math.max(0, (s.clipCount || 1) - 1);
              dbPut('sessions', s).catch(function () { });
            }
            toast('클립을 삭제했어요');
          });
        });
      });
    });
  }

  /* ---------- 차트 ---------- */
  var CLS_COLOR = { deep: '#3f6bff', light: '#4ad6c8', noise: '#f2b45c', snore: '#ff6b81' };

  function setupCanvas(cv, hCss) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var w = cv.clientWidth || 320;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(hCss * dpr);
    cv.style.height = hCss + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hCss);
    return { g: g, w: w, h: hCss };
  }

  function drawTimeline(cv, s) {
    var epochs = s.epochs || [];
    var dim = setupCanvas(cv, 138);
    var g = dim.g, w = dim.w, h = dim.h;
    if (!epochs.length) {
      g.fillStyle = '#5a6379';
      g.font = '12px -apple-system,sans-serif';
      g.textAlign = 'center';
      g.fillText('기록된 구간이 없어요', w / 2, h / 2);
      return;
    }
    var padT = 8, padB = 18;
    var chartH = h - padT - padB;
    var yOf = function (db) { return padT + chartH - clamp((db - 24) / 48, 0, 1) * chartH; };

    g.strokeStyle = '#1b2230';
    g.lineWidth = 1;
    [30, 45, 60].forEach(function (db) {
      var y = Math.round(yOf(db)) + 0.5;
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
      g.fillStyle = '#3b4457';
      g.font = '9px -apple-system,sans-serif';
      g.textAlign = 'left';
      g.fillText(db + 'dB', 2, y - 3);
    });

    var n = epochs.length;
    var bw = w / n;
    for (var i = 0; i < n; i++) {
      var e = epochs[i];
      var x = i * bw;
      var y = yOf(e.avgDb || 30);
      var barH = (padT + chartH) - y;
      g.fillStyle = CLS_COLOR[e.cls] || '#4ad6c8';
      g.globalAlpha = e.cls === 'deep' ? 0.55 : 0.85;
      g.fillRect(x, y, Math.max(bw, 1), Math.max(barH, 1.5));
      g.globalAlpha = 1;
      if (e.cls === 'snore') {
        g.fillStyle = '#ff8b9c';
        g.fillRect(x, padT, Math.max(bw, 1), 3);
      }
    }

    // 축 라벨
    g.fillStyle = '#5d6679';
    g.font = '10px -apple-system,sans-serif';
    g.textAlign = 'left';
    g.fillText(fmtClock(new Date(s.startedAt)), 2, h - 4);
    g.textAlign = 'center';
    g.fillText(fmtClock(new Date(s.startedAt + (n * 30000))), w / 2, h - 4);
    g.textAlign = 'right';
    g.fillText(fmtClock(new Date(s.startedAt + n * 60000)), w - 2, h - 4);
  }

  function updateStorageInfo() {

      if (b) b.textContent = r[1] + '개';
    });
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (est) {
        var el = $('#storage-quota');
        if (!el) return;
        var used = est.usage ? (est.usage / 1048576).toFixed(1) : '?';
        var quota = est.quota ? Math.round(est.quota / 1048576) : '?';
        el.textContent = used + ' MB / ' + quota + ' MB';
      }).catch(function () { });
    }
  }
